<title>Exhibitor Directory</title>
<style>
:root{--blue:#0087d8;--orange:#ff8018;--red:#ff302b;--ink:#222831;--muted:#68717c;--line:#e8edf1}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font-family:"Prompt",sans-serif}
.wrap{width:min(100% - 36px,950px);margin:0 auto;padding:28px 0 44px}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 22px}
.tab{appearance:none;border:1px solid #dce5ec;background:#f7f9fb;color:#53606c;border-radius:12px;padding:12px 8px;font-size:14px;font-weight:700;line-height:1.25;cursor:pointer;min-height:48px}
.tab[aria-selected="true"]{background:#0f5257;border-color:#0f5257;color:#fff;box-shadow:0 4px 15px #0f525726}
.searchbox{display:flex;align-items:center;gap:12px;border:1.5px solid var(--blue);border-radius:32px;height:61px;padding:0 20px;margin:0 0 28px;box-shadow:0 6px 22px #007bc51c}
.searchbox svg{width:20px;height:20px;flex:0 0 auto;color:#71839b}
.searchbox input{border:0;outline:0;width:100%;min-width:0;background:transparent;font-size:15px;color:#303944}
.searchbox input::placeholder{color:#89939e}
.meta{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 2px 14px;color:var(--muted);font-size:13px}
.list{display:flex;flex-direction:column;gap:18px}
.card{position:relative;isolation:isolate;overflow:hidden;border-radius:24px;min-height:178px;background:#777 url("https://futurebuildasia.com/wp-content/uploads/2026/09/4aa8fa2e-67b3-440b-b0f8-5dfdc5146dea.png") center/cover no-repeat;color:#fff;padding:20px 20px 18px}
.card:before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(30,30,30,.54),rgba(35,35,35,.43))}
.card-top{height:41px;display:flex;align-items:flex-start;justify-content:space-between;border-bottom:1px solid #ffffff50}
.type{display:inline-flex;align-items:center;background:var(--orange);border-radius:6px;padding:6px 8px;font-size:13px;font-weight:700}
.booth{display:inline-flex;justify-content:center;align-items:center;min-width:22px;min-height:28px;max-width:120px;padding:4px 6px;background:var(--red);border-radius:6px;font-size:14px;font-weight:700;overflow-wrap:anywhere;text-align:center}
.card-body{display:flex;align-items:center;gap:18px;padding-top:12px;min-height:108px}
.logo-wrap{width:96px;height:96px;flex:0 0 96px;display:flex;align-items:center;justify-content:center;background:#fff;padding:5px;overflow:hidden}
.logo-wrap img{display:block;width:100%;height:100%;object-fit:contain;object-position:50% 50%;margin:auto}
.company{font-size:20px;font-weight:700;line-height:1.35;overflow-wrap:anywhere;text-shadow:0 1px 2px #0003}
.company.no-logo{padding:12px 0}
.empty{padding:44px 18px;text-align:center;border:1px dashed #d6dfe7;border-radius:18px;color:#68717c;line-height:1.6}
@media(max-width:600px){
 .wrap{width:calc(100% - 28px);padding:18px 0 28px}
 .tabs{gap:5px;margin-bottom:16px}
 .tab{font-size:12px;padding:10px 5px;min-height:48px;border-radius:10px}
 .searchbox{height:54px;margin-bottom:22px;padding:0 16px}
 .meta{font-size:12px;margin-bottom:12px}
 .list{gap:14px}
 .card{border-radius:19px;min-height:145px;padding:14px 13px 13px}
 .card-top{height:34px}
 .type{font-size:11px;padding:5px 7px}
 .booth{font-size:12px;min-height:25px;max-width:100px}
 .card-body{gap:12px;padding-top:10px;min-height:88px}
 .logo-wrap{width:72px;height:72px;flex-basis:72px;padding:4px}
 .company{font-size:16px}
}
@media(max-width:360px){.company{font-size:14px}.logo-wrap{width:62px;height:62px;flex-basis:62px;padding:3px}.card{padding-left:11px;padding-right:11px}}
</style>
</head>

let active = 0;
const tabs = document.getElementById('tabs');
const search = document.getElementById('search');
const list = document.getElementById('list');
const count = document.getElementById('count');
const eventLabel = document.getElementById('eventLabel');

function renderTabs(){
  tabs.innerHTML = '';
  events.forEach((event, index) => {
    const button = document.createElement('button');
    button.className = 'tab';
    button.type = 'button';
    button.role = 'tab';
    button.setAttribute('aria-selected', String(index === active));
    button.textContent = event.name;
    button.addEventListener('click', () => {
      active = index;
      renderTabs();
      renderList();
    });
    tabs.appendChild(button);
  });
}
function renderList(){
  const event = events[active];
  const query = search.value.trim().toLocaleLowerCase();
  const filtered = event.items.filter(item => item.name.toLocaleLowerCase().includes(query) || item.booth.toLocaleLowerCase().includes(query));
  eventLabel.textContent = event.name;
  count.textContent = `${filtered.length.toLocaleString()} / ${event.items.length.toLocaleString()} บริษัท`;
  list.innerHTML = '';
  if(!filtered.length){
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = 'ไม่พบชื่อบริษัทที่ค้นหา ลองตรวจสอบคำสะกดหรือค้นหาด้วย Booth No.';
    list.appendChild(empty);
    return;
  }
  const fragment = document.createDocumentFragment();
  filtered.forEach(item => {
    const card = document.createElement('article');
    card.className = 'card';
    const top = document.createElement('div');
    top.className = 'card-top';
    const type = document.createElement('span');
    type.className = 'type';
    type.textContent = 'Exhibitor';
    const booth = document.createElement('span');
    booth.className = 'booth';
    booth.textContent = item.booth || '—';
    top.append(type, booth);
    const body = document.createElement('div');
    body.className = 'card-body';
    if(item.logo){
      const logoWrap = document.createElement('div');
      logoWrap.className = 'logo-wrap';
      const img = document.createElement('img');
      img.src = item.logo;
      img.alt = item.name + ' logo';
      img.loading = 'lazy';
      img.referrerPolicy = 'no-referrer';
      img.onerror = () => { logoWrap.remove(); body.querySelector('.company')?.classList.add('no-logo'); };
      logoWrap.appendChild(img);
      body.appendChild(logoWrap);
    }
    const company = document.createElement('div');
    company.className = 'company' + (item.logo ? '' : ' no-logo');
    company.textContent = item.name;
    body.appendChild(company);
    card.append(top, body);
    fragment.appendChild(card);
  });
  list.appendChild(fragment);
}
search.addEventListener('input', renderList);
renderTabs();
renderList();
</script>
